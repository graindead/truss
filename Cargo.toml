[package]
name = "truss"
version = "0.1.0"
edition = "2024"
description = "A fast native rhythm game chart search and download tool (Chorus Encore client)"
license = "GPL-3.0"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "image", "tokio", "canvas", "lazy"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "time", "macros", "process"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json", "stream", "system-proxy", "query", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
directories = "6"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal", "common-controls-v6"] }
open = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
symphonia = { version = "0.6", default-features = false, features = ["ogg", "vorbis", "mp3", "wav", "pcm", "flac", "opt-simd"] }
symphonia-adapter-libopus = "0.3"
cpal = "0.18"
rtrb = "0.4"
midly = "0.5"
trash = "5.3.0"
rust_xlsxwriter = { version = "0.102.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
sevenz-rust2 = { version = "0.25.0", optional = true, default-features = false }
unrar = { version = "0.5.8", optional = true }
rusqlite = { version = "0.41.1", features = ["bundled"], optional = true }
flate2 = { version = "1", optional = true }
crc32fast = { version = "1", optional = true }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
sha2 = "0.11.1"
base64 = "0.22"

[dev-dependencies]
blake3 = "1"
base64 = "0.22"

[features]
# RhythmVerse search/downloads are part of the normal build. To build without them:
#   cargo build --release --no-default-features
default = ["rhythmverse"]
rhythmverse = ["dep:zip", "dep:sevenz-rust2", "dep:unrar", "dep:rusqlite", "dep:flate2", "dep:crc32fast"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1.34"
